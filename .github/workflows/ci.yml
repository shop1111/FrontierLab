name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "0.10.4+2cc641edf"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check toolchain
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: moon check
        run: moon check --target all --deny-warn

      - name: moon build
        run: moon build --target all --deny-warn

      # Current MoonBit exposes `moon fmt --check`, not `moon fmt --deny-warn`.
      # This is the formatter gate accepted by the latest documented workflow.
      - name: moon fmt --check
        run: moon fmt --check

      # Current MoonBit exposes `moon info` without `--deny-warn`; the diff gate
      # makes generated public interfaces reproducible for review systems.
      - name: moon info
        run: |
          moon info
          git diff --exit-code

      - name: moon test
        run: moon test --target all --deny-warn

      - name: Coverage gate
        run: python scripts/check_coverage.py

      - name: CLI exit matrix
        run: python scripts/validate_cli.py

      - name: Run executable examples
        run: |
          moon run examples/maze_bfs
          moon run examples/weighted_astar
          moon run examples/compare
          moon run examples/insertion_sort > /tmp/insertion-sort.html
          moon run examples/union_find > /tmp/union-find.html
          moon run examples/pathfinding_trace > /tmp/pathfinding.html

      - name: Benchmark correctness smoke
        run: |
          moon run bench --target native -- 100 1000 | tee /tmp/benchmark-smoke.csv
          grep -q '^100,' /tmp/benchmark-smoke.csv
          grep -q '^1000,' /tmp/benchmark-smoke.csv

      - name: Verify CLI render/validate flow
        run: |
          mkdir -p _build/acceptance
          moon run cmd/main -- demo insertion-sort --format svg --output _build/acceptance/insertion-sort.svg
          moon run cmd/main -- demo union-find --format json --output _build/acceptance/union-find.json
          moon run cmd/main -- analyze _build/acceptance/union-find.json | tee _build/acceptance/union-find-analysis.txt
          moon run cmd/main -- validate fixtures/schema-v1/all-events.json
          moon run cmd/main -- render fixtures/schema-v1/all-events.json --format html --output _build/acceptance/all-events.html
          moon run cmd/main -- playground --output _build/acceptance/playground.html
          set +e
          moon run cmd/main -- diagnose fixtures/agent-traces/selection-sort-expected.json fixtures/agent-traces/selection-sort-actual.json --contract insertion-sort-int --object values --format json --counterexample _build/acceptance/selection-counterexample.json --report _build/acceptance/selection-diagnosis.html > _build/acceptance/selection-diagnosis.json
          diagnosis_exit=$?
          set -e
          test "$diagnosis_exit" -eq 2
          python -c 'import json; p=json.load(open("_build/acceptance/selection-diagnosis.json", encoding="utf-8")); assert p["result"]["focus_step"] == 10'
          moon run cmd/main -- demo insertion-sort --format json --output _build/acceptance/insertion-sort.json
          moon run cmd/main -- demo faulty-insertion-sort --format json --output _build/acceptance/faulty-sort.json
          moon run cmd/main -- diff _build/acceptance/union-find.json --from 0 --to 1 --format json > _build/acceptance/diff-report.json
          moon run cmd/main -- breakpoints _build/acceptance/union-find.json --event union --changed-only --format json > _build/acceptance/breakpoint-report.json
          moon run cmd/main -- verify _build/acceptance/insertion-sort.json --contract insertion-sort-int --object values --format json > _build/acceptance/verify-report.json
          set +e
          moon run cmd/main -- verify _build/acceptance/faulty-sort.json --contract sequence-transition --object values --format json --counterexample _build/acceptance/counterexample.json > _build/acceptance/failure-report.json
          verify_exit=$?
          moon run cmd/main -- diverge _build/acceptance/union-find.json _build/acceptance/faulty-sort.json --format json > _build/acceptance/divergence-report.json
          diverge_exit=$?
          set -e
          test "$verify_exit" -eq 2
          test "$diverge_exit" -eq 2
          test -s _build/acceptance/insertion-sort.svg
          test -s _build/acceptance/union-find.json
          test -s _build/acceptance/union-find-analysis.txt
          test -s _build/acceptance/all-events.html
          test -s _build/acceptance/playground.html
          grep -q "AI Trace Clinic" _build/acceptance/playground.html
          if grep -q '<script src=' _build/acceptance/playground.html; then exit 1; fi

      - name: Package module
        run: |
          moon package
          test -s _build/publish/shop1111-frontierlab-0.7.0.zip

      - name: Upload acceptance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontierlab-acceptance-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            _build/acceptance/
            _build/publish/shop1111-frontierlab-0.7.0.zip

  latest-compatibility:
    name: Latest MoonBit compatibility (non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up latest MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Probe strict gates
        run: |
          moon version --all
          moon update
          moon check --target all --deny-warn
          moon build --target all --deny-warn
          moon test --target all --deny-warn
