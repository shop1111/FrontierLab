name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Check toolchain
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Check
        run: moon check --target all

      - name: Test
        run: moon test --target all

      - name: Run examples
        run: |
          moon run examples/maze_bfs
          moon run examples/weighted_astar
          moon run examples/compare
          moon run examples/insertion_sort > /tmp/insertion-sort.html
          moon run examples/union_find > /tmp/union-find.html
          moon run examples/pathfinding_trace > /tmp/pathfinding.html

      - name: Verify exporters and CLI
        run: |
          moon run cmd/main -- demo insertion-sort --format svg --output /tmp/insertion-sort.svg
          moon run cmd/main -- demo union-find --format json --output /tmp/union-find.json
          moon run cmd/main -- validate fixtures/schema-v1/all-events.json
          moon run cmd/main -- render fixtures/schema-v1/all-events.json --format html --output /tmp/all-events.html
          test -s /tmp/insertion-sort.svg
          test -s /tmp/union-find.json
          test -s /tmp/all-events.html
