name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "0.10.18+6c83a7f62"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Generate interactive demos
        run: |
          moon update
          moon run cmd/main -- demo insertion-sort --format html --output docs/insertion-sort.html
          moon run cmd/main -- demo fibonacci --format html --output docs/fibonacci.html
          moon run cmd/main -- demo coin-change --format html --output docs/coin-change.html
          moon run cmd/main -- demo knapsack --format html --output docs/knapsack.html
          moon run cmd/main -- demo lcs --format html --output docs/lcs.html
          moon run cmd/main -- demo union-find --format html --output docs/union-find.html
          moon run cmd/main -- demo pathfinding --format html --output docs/pathfinding.html
          moon run cmd/main -- demo red-black-tree --format html --output docs/red-black-tree.html
          moon run cmd/main -- playground --output docs/playground.html
          test -s docs/index.html
          test -s docs/insertion-sort.html
          test -s docs/knapsack.html
          test -s docs/lcs.html
          test -s docs/union-find.html
          test -s docs/pathfinding.html
          test -s docs/red-black-tree.html
          test -s docs/playground.html
          grep -q "AI Trace Clinic" docs/playground.html
          node scripts/check_renderer.mjs docs/insertion-sort.html
          node scripts/check_playground.mjs docs/playground.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
